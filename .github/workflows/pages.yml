name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out web app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out publishing sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cocode/Book4matter
          ref: 643c927d6a49b8c5a60d4764d535cdda5f2e485c
          path: .publishing
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify reviewed dependency pins
        run: node scripts/check-dependency-policy.mjs
      - name: Check current npm advisories before installation
        run: npm audit --package-lock-only --audit-level=low
      - name: Install locked dependencies on the disposable runner
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare verified browser runtimes and fonts
        run: node scripts/prepare-runtime.mjs
      - name: Prepare publishing sources and asset hashes
        run: node scripts/prepare-project.mjs .publishing
      - name: Check publishing runtimes
        run: npm run check:runtime
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build static site and verify deployment files
        env:
          # app.book4matter.com serves this app at /, not /book4matter-web/.
          # Use the same root for bundles, navigation, and publishing runtimes.
          VITE_BASE_PATH: /
        run: |
          npm run build
          npm run check:dist
      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
